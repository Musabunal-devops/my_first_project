<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .success-container {
            background-color: #fff;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .success-container h2 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 32px;
        }
        .success-container p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .highlight-box {
            background: #e8f5e8;
            border-left: 5px solid #28a745;
            padding: 20px;
            margin: 25px 0;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }
        .highlight-box h3 {
            color: #28a745;
            margin: 0 0 15px 0;
            font-size: 18px;
        }
        .highlight-box p {
            margin: 0;
            font-size: 14px;
        }
        .steps {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        .steps h4 {
            color: #0056b3;
            margin: 0 0 15px 0;
            font-size: 16px;
        }
        .steps ol {
            color: #555;
            margin: 0;
            padding-left: 20px;
        }
        .steps li {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .success-container button,
        .success-container a {
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .success-container button:hover,
        .success-container a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 86, 179, 0.3);
        }
        .icon {
            font-size: 4em;
            color: #28a745;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .flash-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .flash-success {
            background: #d1f2eb;
            color: #0c5460;
            border: 1px solid #a6f3e5;
        }
        .flash-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="icon">🎉</div>
        <h2>Registration Completed Successfully!</h2>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-message flash-success">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <p>Your account has been successfully created! You can now log in.</p>

        <a href="{{ url_for('login') }}">Go to Login Page</a>
        <a href="{{ url_for('index') }}">Return to Homepage</a>
    </div>
</body>
</html>
