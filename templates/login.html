
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CV Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("{{ url_for('static', filename='login_bg.png', v=12345) }}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(2px) saturate(180%);
            -webkit-backdrop-filter: blur(2px) saturate(180%);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 320px;
            width: 90%;
            color: #000;
        }
        h2 {
            color: #000;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #000;
            font-size: 14px;
            font-weight: 600;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            font-size: 14px;
            color: #000;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s ease;
        }
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .flash-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .flash-success {
            background: rgba(40, 167, 69, 0.2);
        }
        .flash-error {
            background: rgba(220, 53, 69, 0.2);
        }
        .links {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .links a {
            color:  rgba(0, 0, 0, 1);
            text-decoration: none;
            font-size: 13px;
            margin: 0 10px;
            transition: 0.3s;
        }
        .links a:hover {
            color:  rgba(0, 0, 0, 1);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Removed Login header and icon -->

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        {% if 'successful' in message.lower() or 'Successfully' in message %}
                            <div class="flash-message flash-success">{{ message }}</div>
                        {% else %}
                            <div class="flash-message flash-error">{{ message }}</div>
                        {% endif %}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Your password">
            </div>
            <button type="submit">Login</button>
        </form>

        <div class="links">
            <a href="{{ url_for('auth.register') }}">Create Account</a>
            <a href="{{ url_for('cv.index') }}">← Homepage</a>
        </div>
    </div>
</body>
</html>
