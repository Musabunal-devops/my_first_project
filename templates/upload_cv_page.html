<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CV | Interactive CV Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='upload_yourcv.png') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background-color: transparent;
            border-radius: 15px;
        }
        p, .alert {
            color: #fff;
        }
        .alert-info {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            color: #fff;
        }
        .btn-custom {
            display: inline-block;
            padding: 12px 25px;
            background-color: transparent;
            color: #fff; /* Yazı rengi beyaz yapıldı */
            text-decoration: none;
            border: 2px solid #fff; /* Çerçeve beyaz yapıldı */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            min-width: 160px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-custom:hover {
            background-color: #fff;
            color: #000;
        }
        .file-info {
            color: #ff4d4d; /* Hata rengi kırmızı yapıldı */
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <form id="upload-form" action="{{ url_for('cv.upload_file') }}" method="post" enctype="multipart/form-data">
            <div class="mb-4 text-center">
                <div class="custom-file-input-wrapper">
                    <label for="file-upload" class="btn-custom">Select File</label>
                    <input type="file" name="file" id="file-upload" class="d-none">
                    <div id="file-name-display" class="file-info">No file selected</div>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn-custom">Upload CV</button>
            </div>
        </form>

        <hr style="border-top: 1px solid rgba(255,255,255,0.3);">
        <p class="text-center"><a href="{{ url_for('cv.index') }}" style="color: #fff; text-decoration: none;">Return to Homepage</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('file-upload');
            const fileNameDisplay = document.getElementById('file-name-display');
            const uploadForm = document.getElementById('upload-form');
 
            // Allow selecting the same file again (resets value on click)
            fileInput.addEventListener('click', function() {
                this.value = null;
            });

            fileInput.addEventListener('change', function(event) {
                if (event.target.files.length > 0) {
                    // Hide the error message if a file is selected
                    fileNameDisplay.style.display = 'none';
                    // Optional: If you want to show the file name specifically, uncomment below:
                    // fileNameDisplay.textContent = event.target.files[0].name;
                    // fileNameDisplay.style.display = 'block';
                }
            });

            uploadForm.addEventListener('submit', function(event) {
                if (fileInput.files.length === 0) {
                    event.preventDefault(); // Stop form submission
                    fileNameDisplay.textContent = 'Please select a file first!';
                    fileNameDisplay.style.display = 'block'; // Show error message
                } else {
                    const file = fileInput.files[0];
                    const allowedExtensions = /(\.pdf|\.doc|\.docx)$/i;
                    if (!allowedExtensions.exec(file.name)) {
                        event.preventDefault();
                        fileNameDisplay.textContent = 'Invalid format! Please upload PDF, DOC, or DOCX.';
                        fileNameDisplay.style.display = 'block';
                    }
                }
            });
        });

        // Ensure form is clean when navigating back
        window.addEventListener('pageshow', function(event) {
            const form = document.querySelector('form');
            if (form) {
                form.reset();
                const fileNameDisplay = document.getElementById('file-name-display');
                if (fileNameDisplay) fileNameDisplay.style.display = 'none';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
