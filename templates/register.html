<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='create_account.png') }}");
            background-size: cover; /* Back to cover to eliminate black bars */
            background-position: center 20%; /* Shifted up slightly to see the face better while filling screen */
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px 25px;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 360px; /* Increased from 320px to 360px to give inputs more width */
            width: 95%;
            color: #ffffff;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 15px; /* Reduced margin from 25px to 15px */
            font-size: 1.4rem; /* Slightly smaller font */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }
        .form-group {
            margin-bottom: 12px; /* Reduced margin from 18px to 12px */
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 4px; /* Reduced margin from 8px to 4px */
            color: #ffffff;
            font-weight: 500;
            font-size: 0.9rem; /* Slightly smaller labels */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* NEW: Wrapper for input and icon */
        .input-wrapper {
            position: relative; /* Position the icon within this wrapper */
            display: flex; /* Align elements (input and icon) inside */
            align-items: center; /* Vertically center */
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            flex-grow: 1;
            padding: 8px 12px; /* Reduced from 12px 15px to 8px 12px */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; /* Slightly smaller radius */
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.9rem; /* Slightly smaller text */
        }
        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            font-size: 1.1em;
        }
        button {
            background-color: transparent;
            color: #ffffff; 
            padding: 10px 20px; /* Slightly smaller padding */
            border: 2px solid #ffffff; 
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px; /* Slightly smaller font */
            font-weight: bold;
            margin-top: 15px; /* Reduced margin */
            width: 100%;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        button:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        input[type="email"] {
            width: 100%; /* Ensure it spans the full width of the container */
            padding: 8px 12px;
            font-size: 1rem; /* Slightly larger text for email */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create New Account</h1>
        <form method="POST" action="{{ url_for('auth.register_post') }}" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="input-wrapper"> {# NEW: Div wrapping input and icon #}
                    <input type="password" id="password" name="password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">&#128065;</span> {# Eye icon #}
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <div class="input-wrapper"> {# NEW: Div wrapping input and icon #}
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirm_password')">&#128065;</span> {# Eye icon #}
                </div>
                <div id="password_match_error" class="error-message" style="display: none;">Passwords do not match!</div>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <a href="{{ url_for('cv.index') }}" class="back-link">Back to Home Page</a>
    </div>

    <script>
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const passwordMatchError = document.getElementById('password_match_error');

            if (password !== confirmPassword) {
                passwordMatchError.style.display = 'block';
                return false; // Prevent form submission
            } else {
                passwordMatchError.style.display = 'none';
                return true; // Allow form submission
            }
        }
    </script>
</body>
</html>
